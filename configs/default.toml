# Default SENSAI configuration.
# A file passed with --config only needs the keys to change.

[model]
# Ollama model. Provisional: to be decided with the team (size, speed, tool calling).
name = "phi4:latest"
host = "http://localhost:11434"
timeout_s = 120  # maximum time without a response from Ollama

[runtime]
# Limits of one AgentRuntime turn.
max_steps = 8
max_tool_calls = 8
timeout_s = 300
max_tokens = 32768  # cumulative tokens (prompt + completion) over one turn

[structured]
# Structured output (T5): repair attempts when the JSON does not match the schema.
max_repairs = 1

[storage]
db_path = "~/.sensai/sensai.db"

[policy]
# Before a tool runs, by risk level: "allow", "ask" (user approval) or "deny".
read = "allow"
write = "ask"
exec = "ask"

[mcp]
# MCP servers (T1), launched over stdio when the chat starts. A server that fails to start is
# reported and skipped. `risk`: "read", "write", "exec" (the policy above applies) or "auto"
# (the server's readOnlyHint decides between "read" and "exec").
timeout_s = 30  # maximum time for one MCP request

