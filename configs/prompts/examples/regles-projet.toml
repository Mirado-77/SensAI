id = "regles-projet"
question = "Quelles règles faut-il suivre avant de proposer une modification au projet agenda ?"
answer = """D'après `CONTRIBUTING.md` :
1. Lancer `make test` : tous les tests doivent passer.
2. Ajouter un test pour chaque bug corrigé.
3. Formater le code avec `make format`.

